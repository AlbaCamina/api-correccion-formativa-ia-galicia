services:
  postgres:
    image: postgres:16-alpine
    container_name: api-correccion-db
    restart: always
    # Credenciales de desarrollo local exclusivamente (NO usar en producción)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: api_correccion_galicia
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_correccion_galicia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
